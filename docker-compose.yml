services:
  db:
    image: postgis/postgis:16-3.4
    container_name: reach-db
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: reach
    ports:
      - "5432:5432"
    volumes:
      - reach-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
volumes:
  reach-db-data:
